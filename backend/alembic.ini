[alembic]
script_location = %(here)s/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
# The database URL comes from app.config (DATABASE_URL), not from this file.

[loggers]
keys = root

