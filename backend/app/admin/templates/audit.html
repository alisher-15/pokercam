{% extends "base.html" %}
{% block content %}
<h1>{{ t('audit.title') }}</h1>
<form method="get" action="/admin/audit" class="inline">
  <label>{{ t('audit.client') }}
    <select name="client_id">
      <option value="">{{ t('audit.all_clients') }}</option>
      {% for client in clients %}<option value="{{ client.id }}"{% if client.id == client_id %} selected{% endif %}>{{ client.name }}</option>{% endfor %}
    </select>
  </label>
  <button>{{ t('audit.filter') }}</button>
</form>
{% include "audit_rows.html" %}
{% endblock %}
