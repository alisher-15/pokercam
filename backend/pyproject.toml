[project]
name = "backend"
version = "0.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
# Generated by contracts/scripts/codegen.sh; CI checks it matches the schemas instead.
extend-exclude = ["app/contracts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
