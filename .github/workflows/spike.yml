# Stage 1 (SPEC 12): the Camera2 spike. Builds an APK to install by hand and runs the
# self-test on an Android emulator: manual settings must apply while the stream runs.
name: Stage 1 spike (Camera2)

on:
  push:
    paths:
      - "spikes/camera2_webrtc/**"
      - ".github/workflows/spike.yml"
  workflow_dispatch:

concurrency:
  group: spike-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.8"

defaults:
  run:
    working-directory: spikes/camera2_webrtc

jobs:
  checks:
    name: Analyze and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test

  apk:
    name: APK to install by hand
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v7
        with:
          name: camera2-spike-apk
          path: spikes/camera2_webrtc/build/app/outputs/flutter-apk/app-debug.apk
      # A direct link to the .apk for a phone or tablet: an artifact is a zip that needs a signed-in
      # browser and does not download from every mobile browser.
      - name: Publish to the spike-apk pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk camera2-spike.apk
          gh release delete spike-apk --yes --cleanup-tag || true
          gh release create spike-apk camera2-spike.apk --prerelease --target "$GITHUB_SHA" \
            --title "Camera2 spike (этап 1) — APK для телефона" \
            --notes "Тестовое приложение этапа 1: ручные ISO, фокус, зум и др. во время трансляции. Скачайте camera2-spike.apk на телефоне или планшете, установите, нажмите «Включить камеру», затем «Автотест» и «Копировать отчёт». Сборка из коммита $GITHUB_SHA."

  emulator:
    name: Self-test on an emulator
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front none
          disable-animations: true
          working-directory: spikes/camera2_webrtc
          script: ./tool/ci_emulator_test.sh
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: camera2-spike-emulator-report
          path: |
            spikes/camera2_webrtc/build/spike-report.json
            spikes/camera2_webrtc/build/spike-test.log
