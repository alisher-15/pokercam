# SPEC 11.2: lint + unit + contracts on every push; integration (and app builds) on PRs into main.
name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Per event: a push does not cancel a manually started full run of the same branch.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.8"
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.12"

jobs:
  contracts:
    name: Contracts and generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json
            media-server/package-lock.json
            tools/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: make setup-backend setup-node PYTHON=python
      - run: cd apps/shared && flutter pub get
      - run: make test-contracts
      - name: Generated code matches contracts/ and the ARB files
        run: make check-generated

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pokercam
          POSTGRES_PASSWORD: pokercam
          POSTGRES_DB: pokercam_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pokercam"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: make setup-backend PYTHON=python
      - run: make lint-backend
      - run: make test-backend

  media-server:
    name: Media-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            media-server/package-lock.json
            tools/package-lock.json
      - run: cd media-server && npm ci --no-audit --no-fund
      - run: cd tools && npm ci --no-audit --no-fund
      - name: FFmpeg for the DVR tests
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      - run: make lint-media-server lint-tools
      - run: make test-media-server
      - run: cd media-server && npm run build

  apps:
    name: Flutter apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: make setup-apps
      - run: make lint-apps
      - run: make test-apps

  build-android:
    name: Build Android APK
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    needs: apps
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Release mode (AOT): what a phone runs, at the speed it will run. Signed with the debug key until stage 8.
      - run: flutter build apk --release
        working-directory: apps/camera_android
      # A direct link for installing on a phone or tablet (an artifact zip does not download from every mobile browser).
      - name: Publish to the camera-apk pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp apps/camera_android/build/app/outputs/flutter-apk/app-release.apk pokercam-camera.apk
          gh release delete camera-apk --yes --cleanup-tag || true
          gh release create camera-apk pokercam-camera.apk --prerelease --target "$GITHUB_SHA" \
            --title "PokerCam — приложение камеры (APK)" \
            --notes "Приложение камеры стола из ветки ${GITHUB_REF_NAME}, коммит $GITHUB_SHA. Скачайте pokercam-camera.apk на телефоне или планшете и установите."

  android-e2e:
    name: Camera app on an emulator (stage 5)
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    needs: [apps, backend, media-server]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/package-lock.json
      # The emulator reaches this machine at its own address; everything is announced there.
      - name: Stack on this machine
        run: |
          HOST_IP=$(hostname -I | awk '{print $1}')
          echo "HOST_IP=$HOST_IP" >> "$GITHUB_ENV"
          cp .env.example .env
          sed -i "s|^RTC_ANNOUNCED_ADDRESS=.*|RTC_ANNOUNCED_ADDRESS=$HOST_IP|; s|^PUBLIC_API_URL=.*|PUBLIC_API_URL=http://$HOST_IP:8000|; s|^PUBLIC_MEDIA_URL=.*|PUBLIC_MEDIA_URL=ws://$HOST_IP:3000/ws|" .env
          make dev
          echo "CLUB_KEY=$(docker compose exec -T backend python -m app.cli create-client "E2E $(date +%s)")" >> "$GITHUB_ENV"
      - name: The PC's bots (headless Chromium)
        run: cd tools && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front none
          disable-animations: true
          working-directory: apps/camera_android
          script: ./tool/ci_e2e.sh
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: camera-e2e
          path: |
            apps/camera_android/build/e2e-test.log
            apps/camera_android/build/harness.log
            apps/camera_android/build/logcat.txt
      - if: failure()
        run: docker compose logs

  deploy-script:
    name: Install script on a clean Ubuntu (deploy/install.sh)
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    needs: [backend, media-server]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: First install, piped into bash as in deploy/README.md
        run: cat deploy/install.sh | sudo bash -s -- --ref "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --ip 127.0.0.1 --dir /opt/pokercam
      - name: Running, admin can sign in, a pairing code comes out
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:3000/health
          sudo grep -q '^ENVIRONMENT=production' /opt/pokercam/.env
          email=$(sudo grep '^ADMIN_EMAIL=' /opt/pokercam/.env | cut -d= -f2-)
          password=$(sudo grep '^ADMIN_PASSWORD=' /opt/pokercam/.env | cut -d= -f2-)
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' -d "email=$email&password=$password" http://localhost:8000/admin/login)" = "303 http://localhost:8000/admin/clients"
          cd /opt/pokercam
          sudo docker compose exec -T backend python -m app.cli seed
          sudo docker compose exec -T backend python -m app.cli pairing-code "Demo club" | grep -E '^code: [0-9]{6}$'
          # Tokens are signed with the generated JWT key: a PC activates and gets one.
          key=$(sudo docker compose exec -T backend python -m app.cli create-client "CI club")
          refresh=$(curl -fsS -H 'Content-Type: application/json' -d "{\"activation_key\": \"$key\", \"machine_id\": \"ci\", \"name\": \"CI PC\"}" \
            http://localhost:8000/api/v1/viewer/activate | python3 -c 'import json, sys; print(json.load(sys.stdin)["refresh_token"])')
          curl -fsS -H 'Content-Type: application/json' -d "{\"refresh_token\": \"$refresh\"}" http://localhost:8000/api/v1/auth/token | grep -q '"access_token"'
      - name: Running it again updates and keeps the secrets
        run: |
          before=$(sudo grep '^JWT_PRIVATE_KEY=' /opt/pokercam/.env)
          sudo bash deploy/install.sh --ref "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --ip 127.0.0.1 --dir /opt/pokercam
          test "$before" = "$(sudo grep '^JWT_PRIVATE_KEY=' /opt/pokercam/.env)"
          curl -fsS http://localhost:8000/health

  build-windows:
    name: Build Windows app
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    needs: apps
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --debug
        working-directory: apps/viewer_windows

  integration:
    name: Integration (docker compose)
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    needs: [backend, media-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: cp .env.example .env
      - run: make dev
      - run: |
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:3000/health
      - name: Install the bots (headless Chromium with a fake camera) and ffprobe
        run: |
          cd tools && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
          command -v ffprobe || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      # Stage 3 (SPEC 12): a fake camera, as many bot viewers as the table allows, one more is refused.
      - name: "Acceptance: the pilot, 1 viewer (.env.example)"
        run: make acceptance
      - name: "Acceptance: 5 viewers"
        run: |
          MAX_VIEWERS_PER_TABLE=5 docker compose up -d --wait media-server
          make acceptance MAX_VIEWERS_PER_TABLE=5
      # Stage 4 (SPEC 7.4): 11 minutes of DVR, FFmpeg killed, access, an expired license (checked every 20 s here).
      - name: "Acceptance: DVR"
        run: |
          LICENSE_CHECK_INTERVAL_S=20 docker compose up -d --wait media-server
          make acceptance-dvr LICENSE_CHECK_INTERVAL_S=20
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
