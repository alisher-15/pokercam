# SPEC 11.2: lint + unit + contracts on every push; integration (and app builds) on PRs into main.
name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: "Windows app: minutes of rewinding with the memory reported (SPEC 8.6); 0 skips it"
        default: "0"

concurrency:
  # Per event: a push does not cancel a manually started full run of the same branch.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.8"
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.12"

jobs:
  contracts:
    name: Contracts and generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json
            media-server/package-lock.json
            tools/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: make setup-backend setup-node PYTHON=python
      - run: cd apps/shared && flutter pub get
      - run: make test-contracts
      - name: Generated code matches contracts/ and the ARB files
        run: make check-generated

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pokercam
          POSTGRES_PASSWORD: pokercam
          POSTGRES_DB: pokercam_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pokercam"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: make setup-backend PYTHON=python
      - run: make lint-backend
      - run: make test-backend

  media-server:
    name: Media-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            media-server/package-lock.json
            tools/package-lock.json
      - run: cd media-server && npm ci --no-audit --no-fund
      - run: cd tools && npm ci --no-audit --no-fund
      - name: FFmpeg for the DVR tests
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      - run: make lint-media-server lint-tools
      - run: make test-media-server
      - run: cd media-server && npm run build

  apps:
    name: Flutter apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: make setup-apps
      - run: make lint-apps
      - run: make test-apps

  # Stage 8 (SPEC 10.1): both brands of branding/ with one command each (tools/brand/brand.ts), each APK
  # checked for its own package and name; the default brand's goes to the camera-apk pre-release.
  build-android:
    name: Build Android APKs (both brands)
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    needs: apps
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Release mode (AOT): what a phone runs, at the speed it will run. Signed with the debug key for now.
      - name: make build BRAND=demo, then BRAND=default
        run: |
          for brand in demo default; do make build BRAND=$brand; done
      - name: Each APK is its brand's (package, name)
        run: |
          aapt=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt
          for brand in demo default; do
            apk=$(ls build/brand/$brand/*-camera.apk)
            badging=$("$aapt" dump badging "$apk")
            want_id=$(jq -r .android_application_id branding/$brand/brand.json)
            want_name=$(jq -r .app_name branding/$brand/brand.json)
            echo "$brand: $(echo "$badging" | grep -E "^package:|^application-label:")"
            echo "$badging" | grep -q "^package: name='$want_id'" || { echo "::error::$apk is not $want_id"; exit 1; }
            echo "$badging" | grep -q "^application-label:'$want_name'" || { echo "::error::$apk is not named $want_name"; exit 1; }
          done
      - run: cp build/brand/default/pokercam-camera.apk pokercam-camera.apk
      # Also on the run's page, whatever happens to the release below.
      - uses: actions/upload-artifact@v7
        with:
          name: camera-apks
          path: build/brand/*/*-camera.apk
      # A direct link for installing on a phone or tablet (an artifact zip does not download from every mobile
      # browser). The file in the existing release is replaced, never the release deleted first: when GitHub
      # refuses to create one (it did, 403), the link must keep working.
      - name: Publish to the camera-apk pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          name=$(jq -r .app_name branding/default/brand.json)
          notes="Приложение камеры стола из ветки ${GITHUB_REF_NAME}, коммит $GITHUB_SHA. Скачайте pokercam-camera.apk на телефоне или планшете и установите."
          if gh release view camera-apk > /dev/null 2>&1; then
            gh release upload camera-apk pokercam-camera.apk --clobber
            gh release edit camera-apk --notes "$notes"
          else
            gh release create camera-apk pokercam-camera.apk --prerelease --target "$GITHUB_SHA" \
              --title "$name — приложение камеры (APK)" --notes "$notes"
          fi

  android-e2e:
    name: Camera app on an emulator (stage 5)
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    needs: [apps, backend, media-server]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/package-lock.json
      # The emulator reaches this machine at its own address; everything is announced there.
      - name: Stack on this machine
        run: |
          HOST_IP=$(hostname -I | awk '{print $1}')
          echo "HOST_IP=$HOST_IP" >> "$GITHUB_ENV"
          cp .env.example .env
          sed -i "s|^RTC_ANNOUNCED_ADDRESS=.*|RTC_ANNOUNCED_ADDRESS=$HOST_IP|; s|^PUBLIC_API_URL=.*|PUBLIC_API_URL=http://$HOST_IP:8000|; s|^PUBLIC_MEDIA_URL=.*|PUBLIC_MEDIA_URL=ws://$HOST_IP:3000/ws|" .env
          make dev
          echo "CLUB_KEY=$(docker compose exec -T backend python -m app.cli create-client "E2E $(date +%s)")" >> "$GITHUB_ENV"
      - name: The PC's bots (headless Chromium)
        run: cd tools && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front none
          disable-animations: true
          working-directory: apps/camera_android
          script: ./tool/ci_e2e.sh
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: camera-e2e
          path: |
            apps/camera_android/build/e2e-test.log
            apps/camera_android/build/harness.log
            apps/camera_android/build/logcat.txt
      - if: failure()
        run: docker compose logs

  deploy-script:
    name: Install script on a clean Ubuntu (deploy/install.sh)
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    needs: [backend, media-server]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: First install, piped into bash as in deploy/README.md
        run: cat deploy/install.sh | sudo bash -s -- --ref "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --ip 127.0.0.1 --dir /opt/pokercam
      - name: Running, admin can sign in, a pairing code comes out
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:3000/health
          sudo grep -q '^ENVIRONMENT=production' /opt/pokercam/.env
          email=$(sudo grep '^ADMIN_EMAIL=' /opt/pokercam/.env | cut -d= -f2-)
          password=$(sudo grep '^ADMIN_PASSWORD=' /opt/pokercam/.env | cut -d= -f2-)
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' -d "email=$email&password=$password" http://localhost:8000/admin/login)" = "303 http://localhost:8000/admin/clients"
          cd /opt/pokercam
          sudo docker compose exec -T backend python -m app.cli seed
          sudo docker compose exec -T backend python -m app.cli pairing-code "Demo club" | grep -E '^code: [0-9]{6}$'
          # Tokens are signed with the generated JWT key: a PC activates and gets one.
          key=$(sudo docker compose exec -T backend python -m app.cli create-client "CI club")
          refresh=$(curl -fsS -H 'Content-Type: application/json' -d "{\"activation_key\": \"$key\", \"machine_id\": \"ci\", \"name\": \"CI PC\"}" \
            http://localhost:8000/api/v1/viewer/activate | python3 -c 'import json, sys; print(json.load(sys.stdin)["refresh_token"])')
          curl -fsS -H 'Content-Type: application/json' -d "{\"refresh_token\": \"$refresh\"}" http://localhost:8000/api/v1/auth/token | grep -q '"access_token"'
      - name: Running it again updates and keeps the secrets
        run: |
          before=$(sudo grep '^JWT_PRIVATE_KEY=' /opt/pokercam/.env)
          sudo bash deploy/install.sh --ref "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --ip 127.0.0.1 --dir /opt/pokercam
          test "$before" = "$(sudo grep '^JWT_PRIVATE_KEY=' /opt/pokercam/.env)"
          curl -fsS http://localhost:8000/health

  # Stage 8 (SPEC 8.6, 10.1): the program and its Inno Setup installer for both brands, each checked for its
  # names and installed, started and uninstalled without a window or administrator rights; the default
  # brand's installer (and the zip) goes to the viewer-windows pre-release.
  build-windows:
    name: Build Windows installers (both brands)
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    needs: apps
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Installers, demo first, then default
        run: |
          foreach ($brand in 'demo', 'default') {
            $name = (Get-Content "branding/$brand/brand.json" | ConvertFrom-Json).app_name
            Push-Location tools; node brand/brand.ts windows $brand; $built = $LASTEXITCODE; Pop-Location
            if ($built -ne 0) { exit 1 }
            $exe = "apps/viewer_windows/build/windows/x64/runner/Release/viewer_windows.exe"
            $product = (Get-Item $exe).VersionInfo.ProductName
            Write-Output "$brand : ProductName '$product'"
            if ($product -ne $name) { Write-Output "::error::$exe is '$product', not '$name'"; exit 1 }
          }
      - name: Each installer installs, starts and uninstalls for the current user
        run: |
          foreach ($brand in 'demo', 'default') {
            $setup = Get-ChildItem "build/brand/$brand/*-setup.exe" | Select-Object -First 1
            $dir = Join-Path $env:RUNNER_TEMP "install-$brand"
            $run = Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$dir" -Wait -PassThru
            if ($run.ExitCode -ne 0) { Write-Output "::error::$($setup.Name) exited $($run.ExitCode)"; exit 1 }
            foreach ($file in 'viewer_windows.exe', 'flutter_windows.dll', 'vcruntime140.dll', 'msvcp140.dll') {
              if (-not (Test-Path (Join-Path $dir $file))) { Write-Output "::error::$brand installed no $file"; exit 1 }
            }
            $app = Start-Process (Join-Path $dir 'viewer_windows.exe') -PassThru
            Start-Sleep -Seconds 15
            if ($app.HasExited) { Write-Output "::error::$brand's program exited with $($app.ExitCode)"; exit 1 }
            Write-Output "$brand : $($setup.Name) installed in $dir, the program runs ($([math]::Round($setup.Length / 1MB)) MB)"
            Stop-Process -Id $app.Id -Force
            Start-Sleep -Seconds 2
            Start-Process (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
            for ($i = 0; $i -lt 30 -and (Test-Path (Join-Path $dir 'viewer_windows.exe')); $i++) { Start-Sleep -Seconds 1 }
            if (Test-Path (Join-Path $dir 'viewer_windows.exe')) { Write-Output "::error::$brand did not uninstall"; exit 1 }
          }
      # The zip as before, for unpacking without installing: the default brand's (built last).
      - run: |
          Compress-Archive -Path apps/viewer_windows/build/windows/x64/runner/Release/* -DestinationPath pokercam-viewer-windows.zip
          Copy-Item build/brand/default/pokercam-setup.exe pokercam-setup.exe
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installers
          path: |
            build/brand/*/*-setup.exe
            pokercam-viewer-windows.zip
      - name: Publish to the viewer-windows pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $name = (Get-Content branding/default/brand.json | ConvertFrom-Json).app_name
          $notes = "Программа для компьютера клуба из ветки $env:GITHUB_REF_NAME, коммит $env:GITHUB_SHA. Установщик: pokercam-setup.exe (без прав администратора). Без установки: распакуйте pokercam-viewer-windows.zip и запустите viewer_windows.exe."
          gh release view viewer-windows *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload viewer-windows pokercam-setup.exe pokercam-viewer-windows.zip --clobber
            if ($LASTEXITCODE -ne 0) { exit 1 }
            gh release edit viewer-windows --notes $notes
          } else {
            gh release create viewer-windows pokercam-setup.exe pokercam-viewer-windows.zip --prerelease --target "$env:GITHUB_SHA" `
              --title "$name — программа для ПК (Windows)" --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }

  # Stages 6 and 7 (SPEC 12: the camera is controlled from the PC; the DVR on Windows): the real Windows app
  # against backend and media-server running on the same Windows machine (PostgreSQL is on the runner, FFmpeg
  # from Chocolatey records the DVR), with a fake camera in Chromium; tools/acceptance/stage6.ts +
  # integration_test/e2e_test.dart. First the DVR's precision on numbered frames (dvr_player_test.dart).
  windows-e2e:
    name: Windows app against the servers (stages 6-7)
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    needs: [backend, media-server, apps]
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      DATABASE_URL: postgresql+psycopg://pokercam:pokercam@127.0.0.1:5432/pokercam
      INTERNAL_API_TOKEN: windows-e2e-internal-token
      PUBLIC_API_URL: http://127.0.0.1:8000
      PUBLIC_MEDIA_URL: ws://127.0.0.1:3000/ws
      MEDIA_SERVER_URL: http://127.0.0.1:3000
      BACKEND_URL: http://127.0.0.1:8000
      RTC_ANNOUNCED_ADDRESS: 127.0.0.1
      DVR_ENABLED: "true"
      DVR_DIR: ${{ github.workspace }}\dvr
      MAX_VIEWERS_PER_TABLE: "2"
      MEDIASOUP_WORKERS: "1"
      SOAK_MINUTES: ${{ inputs.soak_minutes || '0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: PostgreSQL (installed on the runner, stopped)
        run: |
          $pg = Get-Service -Name postgresql*
          Set-Service -InputObject $pg -Status running -StartupType automatic
          $env:PGPASSWORD = 'root'
          & "$env:PGBIN\psql" -U postgres -c "CREATE USER pokercam WITH PASSWORD 'pokercam'"
          & "$env:PGBIN\psql" -U postgres -c "CREATE DATABASE pokercam OWNER pokercam"
      # Installs only: on a Windows runner a process started in one step is gone when the step ends.
      - name: Install backend, media-server, the fake camera and FFmpeg
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }
          pip install -r backend/requirements.txt
          Push-Location media-server; npm ci --no-audit --no-fund; npm run build; Pop-Location
          Push-Location tools; npm ci --no-audit --no-fund; npx playwright install chromium; Pop-Location
      - name: "DVR: every key on the expected frame (SPEC 8.6)"
        working-directory: apps/viewer_windows
        run: flutter test integration_test/dvr_player_test.dart -d windows --reporter expanded
      - name: "Acceptance: the Windows app controls the camera and rewinds the DVR"
        run: |
          function Wait-Url($url, $tries = 60) {
            for ($i = 0; $i -lt $tries; $i++) { try { Invoke-RestMethod $url | Out-Null; return } catch { Start-Sleep 2 } }
            throw "no answer from $url"
          }
          $logs = $env:GITHUB_WORKSPACE
          # WebRTC on Windows does not reach 127.0.0.1 from the network card's address: announce the card's.
          $env:RTC_ANNOUNCED_ADDRESS = (Get-NetIPAddress -AddressFamily IPv4 |
            Where-Object { $_.IPAddress -ne '127.0.0.1' -and $_.IPAddress -notlike '169.254.*' } |
            Select-Object -First 1).IPAddress
          Write-Output "announced address: $env:RTC_ANNOUNCED_ADDRESS"
          $failed = $true
          try {
            Push-Location backend
            python -m alembic upgrade head
            Start-Process python -ArgumentList '-m','uvicorn','app.main:app','--host','127.0.0.1','--port','8000' `
              -RedirectStandardOutput "$logs/backend.log" -RedirectStandardError "$logs/backend.err.log"
            Wait-Url http://127.0.0.1:8000/health
            $key = (python -m app.cli create-client "Windows e2e").Trim()
            Pop-Location
            Start-Process node -ArgumentList 'dist/index.js' -WorkingDirectory media-server `
              -RedirectStandardOutput "$logs/media-server.log" -RedirectStandardError "$logs/media-server.err.log"
            Wait-Url http://127.0.0.1:3000/health
            $wait = [string](900 + 60 * [int]$env:SOAK_MINUTES)
            $harness = Start-Process node -ArgumentList 'acceptance/stage6.ts','--key',$key,'--port','8766','--wait',$wait `
              -WorkingDirectory tools -RedirectStandardOutput "$logs/harness.log" -RedirectStandardError "$logs/harness.err.log" -PassThru
            Wait-Url http://127.0.0.1:8766/setup 90
            Push-Location apps/viewer_windows
            flutter test integration_test/e2e_test.dart -d windows --dart-define=E2E_HARNESS=http://127.0.0.1:8766 `
              --dart-define=SOAK_MINUTES=$env:SOAK_MINUTES --timeout=none --reporter expanded
            $app = $LASTEXITCODE
            Pop-Location
            $harness.WaitForExit(1000 * [int]$wait) | Out-Null
            Get-Content "$logs/harness.log"
            Write-Output "app test: $app, harness: $($harness.ExitCode)"
            $failed = $app -ne 0 -or $harness.ExitCode -ne 0
          } finally {
            Set-Location $env:GITHUB_WORKSPACE
            if ($failed) {
              foreach ($f in 'backend.log','backend.err.log','media-server.log','media-server.err.log','harness.log','harness.err.log') {
                if (Test-Path $f) { Write-Output "--- $f"; Get-Content $f -Tail 80 }
              }
            }
          }
          if ($failed) { exit 1 }

  integration:
    name: Integration (docker compose)
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    needs: [backend, media-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: cp .env.example .env
      - run: make dev
      - run: |
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:3000/health
      - name: Install the bots (headless Chromium with a fake camera) and ffprobe
        run: |
          cd tools && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
          command -v ffprobe || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      # Stage 3 (SPEC 12): a fake camera, as many bot viewers as the table allows, one more is refused.
      - name: "Acceptance: the pilot, 1 viewer (.env.example)"
        run: make acceptance
      - name: "Acceptance: 5 viewers"
        run: |
          MAX_VIEWERS_PER_TABLE=5 docker compose up -d --wait media-server
          make acceptance MAX_VIEWERS_PER_TABLE=5
      # Stage 4 (SPEC 7.4): 11 minutes of DVR, FFmpeg killed, access, an expired license (checked every 20 s here).
      - name: "Acceptance: DVR"
        run: |
          LICENSE_CHECK_INTERVAL_S=20 docker compose up -d --wait media-server
          make acceptance-dvr LICENSE_CHECK_INTERVAL_S=20
      # The browser viewer at media-server's /viewer/ (the club's PC until the Windows client), opened at the
      # machine's address as a club's PC does: not a secure context there (no crypto.randomUUID and the like).
      # Last: each run activates PCs, and the backend allows 5 activations a minute from one address.
      - name: "Acceptance: the browser viewer"
        run: |
          ip=$(hostname -I | awk '{print $1}')
          sed -i '/^PUBLIC_MEDIA_URL=/d' .env && echo "PUBLIC_MEDIA_URL=ws://$ip:3000/ws" >> .env
          docker compose up -d --wait backend
          make acceptance-viewer VIEWER_HOST="$ip"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
