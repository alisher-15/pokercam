name: shared
description: "Shared code of the camera and viewer apps: contracts, wire format, networking, localization, brand theme."
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # REST calls to the backend (SPEC 5.2), from the Dart team; MockClient makes them testable.
  http: ^1.6.0
  intl: any

dev_dependencies:
  collection: any
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
