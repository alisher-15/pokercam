include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Generated by contracts/scripts/codegen.sh and flutter gen-l10n.
    - lib/src/contracts/**
    - lib/l10n/app_localizations*.dart
    - test/contract_models.dart
    - build/**

linter:
  rules:
    - prefer_single_quotes
    - always_declare_return_types
