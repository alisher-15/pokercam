<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PokerCam</title>
    <style>
      :root {
        --bg: #111418;
        --panel: #1b2027;
        --line: #2c333d;
        --text: #e8ebef;
        --muted: #9aa4b1;
        --accent: #4f8cff;
        --ok: #3ccf7a;
        --warn: #f2b33d;
        --bad: #ff5d5d;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      button,
      select,
      input {
        font: inherit;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 10px;
      }
      button {
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      header {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 16px;
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        font-size: 16px;
        margin: 0 auto 0 0;
      }
      .center {
        max-width: 420px;
        margin: 64px auto;
        padding: 0 16px;
        display: grid;
        gap: 12px;
      }
      .center label {
        display: grid;
        gap: 4px;
        color: var(--muted);
      }
      .error {
        color: var(--bad);
      }
      .muted {
        color: var(--muted);
      }
      .watch {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 12px;
        padding: 12px 16px;
      }
      @media (max-width: 900px) {
        .watch {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .stage {
        position: relative;
        background: #000;
        border-radius: 8px;
        aspect-ratio: 16 / 9;
        overflow: hidden;
      }
      .stage video {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .chip {
        position: absolute;
        top: 10px;
        left: 10px;
        padding: 3px 10px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.6);
        font-weight: 600;
      }
      .chip.live {
        background: var(--bad);
      }
      .banner {
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: 10px;
        padding: 8px 12px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.7);
        border-left: 4px solid var(--warn);
      }
      .banner.critical {
        border-left-color: var(--bad);
      }
      .side {
        display: grid;
        gap: 12px;
        align-content: start;
      }
      section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
      }
      section h2 {
        font-size: 13px;
        margin: 0 0 6px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 12px;
        margin: 0;
      }
      dt {
        color: var(--muted);
      }
      dd {
        margin: 0;
        text-align: right;
      }
      .param {
        display: grid;
        gap: 4px;
        padding: 6px 0;
        border-top: 1px solid var(--line);
      }
      .param:first-of-type {
        border-top: 0;
      }
      .param .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .param .row > :first-child {
        margin-right: auto;
      }
      .param input[type="range"] {
        width: 100%;
        padding: 0;
      }
      .ack.ok {
        color: var(--ok);
      }
      .ack.bad {
        color: var(--bad);
      }
      .tables {
        display: grid;
        gap: 8px;
      }
      .tables button {
        display: flex;
        justify-content: space-between;
        padding: 12px;
      }
      dialog {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 8px;
        text-align: center;
        max-width: 360px;
      }
      dialog .qr svg {
        width: 260px;
        height: 260px;
        background: #fff;
        border-radius: 6px;
      }
      dialog .code {
        font-size: 32px;
        letter-spacing: 0.15em;
        font-weight: 700;
        margin: 8px 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="viewer.js"></script>
  </body>
</html>
