# Local development and the base of deployment (SPEC 11.3): make dev
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pokercam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokercam}
      POSTGRES_DB: ${POSTGRES_DB:-pokercam}
    ports:
      # Local only: backend tests and database tools on the host.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Secrets and settings (JWT_PRIVATE_KEY, HASH_SECRET, TIMEZONE, ...) come from .env.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pokercam}:${POSTGRES_PASSWORD:-pokercam}@postgres:5432/${POSTGRES_DB:-pokercam}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MEDIA_SERVER_URL: http://media-server:3000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3

  media-server:
    build: ./media-server
    restart: unless-stopped
    # INTERNAL_API_TOKEN and the RTC_* settings come from .env.
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BACKEND_URL: http://backend:8000
      RTC_LISTEN_IP: 0.0.0.0
      RTC_PORT_MIN: ${RTC_PORT_MIN:-40000}
      RTC_PORT_MAX: ${RTC_PORT_MAX:-40003}
      MAX_VIEWERS_PER_TABLE: ${MAX_VIEWERS_PER_TABLE:-5}
    ports:
      - "${MEDIA_SERVER_PORT:-3000}:3000"
      # WebRTC: one UDP+TCP port per mediasoup worker; clients reach them at RTC_ANNOUNCED_ADDRESS.
      - "${RTC_PORT_MIN:-40000}-${RTC_PORT_MAX:-40003}:${RTC_PORT_MIN:-40000}-${RTC_PORT_MAX:-40003}/udp"
      - "${RTC_PORT_MIN:-40000}-${RTC_PORT_MAX:-40003}:${RTC_PORT_MIN:-40000}-${RTC_PORT_MAX:-40003}/tcp"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  postgres-data:
